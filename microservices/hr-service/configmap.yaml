apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-service-config
  namespace: hr-service
  labels:
    app: hr-service
data:
  SPRING_PROFILES_ACTIVE: "prod"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "INFO"
  DB_PORT: "5432"
  DB_NAME: "hrservice"
  DB_HOST: "${DB_HOST}"  # Injected from Terraform output
  NEW_RELIC_APP_NAME: "hr-service"
  NEW_RELIC_ENABLED: "true"  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  SQS_HR_EVENTS_QUEUE: "hr-events.fifo"
  SQS_CONSUMER_WAIT_TIME_SECONDS: "20"
  SQS_MAX_NUMBER_OF_MESSAGES: "10"