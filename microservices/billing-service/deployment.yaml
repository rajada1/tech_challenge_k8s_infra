apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing-service
  labels:
    app: billing-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/api/v1/actuator/prometheus"
    spec:
      serviceAccountName: billing-service-sa
      containers:
        - name: billing-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/billing-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: SERVER_PORT
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: SPRING_PROFILES_ACTIVE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: LOG_LEVEL
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: AWS_REGION
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: MONGODB_DATABASE
            - name: NEW_RELIC_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: NEW_RELIC_APP_NAME
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: MONGODB_URI
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: MONGODB_USERNAME
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: MONGODB_PASSWORD
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: ENVIRONMENT
                  optional: true
            # Kafka Configuration (Event-Driven Architecture)
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_CONSUMER_GROUP
              value: "billing-service-group"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-service-sa
  namespace: billing-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/billing-service-role
