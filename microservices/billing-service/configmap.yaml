apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: billing-service
data:
  SERVER_PORT: "8082"
  SPRING_PROFILES_ACTIVE: "prod"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  MONGODB_DATABASE: "billing_db"
  NEW_RELIC_APP_NAME: "billing-service-prod"
  ENVIRONMENT: "production"
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "billing-service-group"
