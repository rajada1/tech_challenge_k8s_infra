apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: notification-service
  labels:
    app: notification-service
data:
  SPRING_PROFILES_ACTIVE: "prod"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "INFO"
  DB_PORT: "5432"
  DB_NAME: "notificationservice"
  DB_HOST: "${DB_HOST}"  # Injected from Terraform output
  NEW_RELIC_APP_NAME: "notification-service"
  NEW_RELIC_ENABLED: "true"  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  SQS_NOTIFICATION_EVENTS_QUEUE: "notification-events.fifo"
  SQS_CONSUMER_WAIT_TIME_SECONDS: "20"
  SQS_MAX_NUMBER_OF_MESSAGES: "10"