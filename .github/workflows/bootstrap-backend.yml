name: Bootstrap S3 Backend

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - destroy

env:
  AWS_REGION: us-east-1
  BUCKET_NAME: tfstate-backend-fiap-1213

jobs:
  bootstrap:
    name: Bootstrap S3 Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if bucket exists
        id: check_bucket
        run: |
          if aws s3api head-bucket --bucket ${{ env.BUCKET_NAME }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Bucket ${{ env.BUCKET_NAME }} já existe"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Bucket ${{ env.BUCKET_NAME }} não existe"
          fi

      - name: Create S3 Bucket
        if: github.event.inputs.action == 'create' && steps.check_bucket.outputs.exists == 'false'
        run: |
          aws s3api create-bucket \
            --bucket ${{ env.BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Bucket criado com sucesso"

      - name: Enable Versioning
        if: github.event.inputs.action == 'create'
        run: |
          aws s3api put-bucket-versioning \
            --bucket ${{ env.BUCKET_NAME }} \
            --versioning-configuration Status=Enabled
          
          echo "✅ Versionamento habilitado"

      - name: Enable Encryption
        if: github.event.inputs.action == 'create'
        run: |
          aws s3api put-bucket-encryption \
            --bucket ${{ env.BUCKET_NAME }} \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          
          echo "✅ Criptografia habilitada"

      - name: Add Tags
        if: github.event.inputs.action == 'create'
        run: |
          aws s3api put-bucket-tagging \
            --bucket ${{ env.BUCKET_NAME }} \
            --tagging 'TagSet=[
              {Key=Name,Value=tfstates_tech_challenge},
              {Key=Environment,Value=Production},
              {Key=ManagedBy,Value=GitHub-Actions},
              {Key=Purpose,Value=Terraform-State}
            ]'
          
          echo "✅ Tags adicionadas"

      - name: Destroy S3 Bucket
        if: github.event.inputs.action == 'destroy' && steps.check_bucket.outputs.exists == 'true'
        run: |
          echo "⚠️ Removendo todos os objetos do bucket..."
          aws s3 rm s3://${{ env.BUCKET_NAME }} --recursive
          
          echo "⚠️ Removendo versões anteriores..."
          aws s3api delete-objects \
            --bucket ${{ env.BUCKET_NAME }} \
            --delete "$(aws s3api list-object-versions \
              --bucket ${{ env.BUCKET_NAME }} \
              --output json \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}')" \
            2>/dev/null || true
          
          echo "⚠️ Deletando bucket..."
          aws s3api delete-bucket \
            --bucket ${{ env.BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Bucket destruído com sucesso"

      - name: Summary
        if: always()
        run: |
          echo "### Resumo da Execução 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ação:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket:** ${{ env.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Região:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "create" ]; then
            echo "✅ Bucket de backend provisionado e configurado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Recursos configurados:**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Versionamento habilitado" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Criptografia AES256" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Acesso público bloqueado" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Tags aplicadas" >> $GITHUB_STEP_SUMMARY
          else
            echo "🗑️ Bucket de backend removido" >> $GITHUB_STEP_SUMMARY
          fi