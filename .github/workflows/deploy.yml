name: Deploy EKS Infrastructure
# go

on:
  push:
    branches:
      - master
      - fase/quatro
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
      use_minikube:
        description: "Provision Minikube EC2 instead of EKS"
        required: false
        default: true
        type: choice
        options:
          - true
          - false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.0

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    env:
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_environment: ${{ github.event.inputs.environment || 'homolog' }}
      TF_VAR_use_minikube: ${{ github.event.inputs.use_minikube || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Clean up existing CloudWatch Log Groups
        run: |
          echo "Checking for existing CloudWatch Log Groups..."

          # Delete existing EKS log group if it exists
          aws logs delete-log-group \
            --log-group-name /aws/eks/tech-challenge-cluster/cluster \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Log group doesn't exist or already deleted"

          echo "CloudWatch Log Groups cleanup completed"

      - name: Configure kubectl from existing state
        # When switching from EKS to Minikube (use_minikube=true), Terraform still needs
        # to destroy existing Kubernetes resources from state. This step pre-configures
        # kubectl so the kubernetes/helm providers can authenticate during plan/apply.
        run: |
          EXISTING_CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          if [ -n "$EXISTING_CLUSTER" ]; then
            echo "Found existing EKS cluster in state: $EXISTING_CLUSTER — configuring kubectl..."
            aws eks update-kubeconfig \
              --region ${{ env.AWS_REGION }} \
              --name "$EXISTING_CLUSTER" || echo "WARNING: could not configure kubectl; continuing anyway"
          else
            echo "No existing EKS cluster in state — skipping kubectl pre-config"
          fi

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        # Apply runs for both modes:
        #   use_minikube=true  -> creates EC2 Minikube, destroys EKS and k8s resources from state
        #   use_minikube=false -> creates/updates EKS cluster
        if: steps.plan.outcome == 'success'
        run: terraform apply -auto-approve -input=false tfplan

      - name: Get EKS Outputs
        if: env.TF_VAR_use_minikube == 'false'
        id: outputs
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "region=$(terraform output -raw region)" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "private_subnets=$(terraform output -raw private_subnets)" >> $GITHUB_OUTPUT
          echo "cluster_security_group_id=$(terraform output -raw cluster_security_group_id)" >> $GITHUB_OUTPUT

      - name: Store EKS Config in SSM
        if: env.TF_VAR_use_minikube == 'false'
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment || 'homolog' }}
          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/eks/cluster_name" \
            --value "${{ steps.outputs.outputs.cluster_name }}" \
            --type "String" \
            --overwrite

          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/eks/cluster_endpoint" \
            --value "${{ steps.outputs.outputs.cluster_endpoint }}" \
            --type "String" \
            --overwrite

          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/eks/region" \
            --value "${{ steps.outputs.outputs.region }}" \
            --type "String" \
            --overwrite
            
          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/vpc/id" \
            --value "${{ steps.outputs.outputs.vpc_id }}" \
            --type "String" \
            --overwrite
            
          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/vpc/private_subnets" \
            --value "${{ steps.outputs.outputs.private_subnets }}" \
            --type "String" \
            --overwrite
            
          aws ssm put-parameter \
            --name "/oficina/$ENVIRONMENT/eks/security_group_id" \
            --value "${{ steps.outputs.outputs.cluster_security_group_id }}" \
            --type "String" \
            --overwrite

      - name: Configure kubectl
        if: env.TF_VAR_use_minikube == 'false'
        run: |
          aws eks update-kubeconfig \
            --region ${{ steps.outputs.outputs.region }} \
            --name ${{ steps.outputs.outputs.cluster_name }}

      - name: Verify EKS Cluster
        if: env.TF_VAR_use_minikube == 'false'
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Get AWS Account ID
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Replace AWS Account ID in K8s manifests
        if: env.TF_VAR_use_minikube == 'false'
        run: |
          echo "Replacing <AWS_ACCOUNT_ID> with actual account ID in deployment manifests..."
          find microservices/ -name '*.yaml' -exec sed -i "s/<AWS_ACCOUNT_ID>/${{ steps.account.outputs.account_id }}/g" {} +
          echo "Replacement completed."

      - name: Deploy microservices via Kustomize
        if: env.TF_VAR_use_minikube == 'false'
        run: |
          kubectl apply -k . || echo "Kustomize deploy completed with warnings"
