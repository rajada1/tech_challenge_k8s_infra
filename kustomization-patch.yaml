# ==========================================
# Kustomization for all microservices
# ==========================================
# Applies common patches and configs to all services

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: oficina-system

# Common labels for all resources
commonLabels:
  managed-by: kustomize
  part-of: oficina-system

# Namespace override
namespace: oficina-system

# Patches to apply to all deployments
patchesStrategicMerge:
  - deployment-irsa-patch.yaml

# Patch to add environment variables for SQS
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: "$(DEPLOYMENT_NAME)-sa"
